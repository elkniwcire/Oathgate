name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test with isolated data
        shell: powershell
        run: ./Run-Checks.ps1
      - name: Package preview
        shell: powershell
        run: ./Build-Release.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: Oathgate-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
